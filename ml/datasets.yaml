# ml/datasets.yaml — Researchly dataset / corpus / model registry
#
# The single record of every body of text, word list, model or knowledge
# source the project uses or plans to use. ARCHITECTURE.md §5.7 and the
# ADR-06 promotion gate require an entry here before any model trained on a
# source can reach production. PLAN.md S0 owns this file.
#
# THE RULE: nothing is used for a shipped artefact (engine package, app,
# container image, model weights, Learn card, exemplar index) unless that
# source's permitted_use includes ship_model or ship_text.
#
# Fields
#   id               short kebab-case key; never reuse a retired id
#   name             human name
#   kind             corpus | lexicon | model | knowledge_source | eval_set
#   source           URL, or "owner-provided", or "third-party PDF (private)"
#   location         repo path if present locally, else null
#   in_git           true if the files are tracked in this (private) repo
#   licence          SPDX id or the exact licence wording; "unknown — verify"
#   licence_verified true ONLY if the licence text/page was seen first-hand
#                    by whoever last edited the entry; licence_evidence then
#                    names the URL or file it was seen in. A licence copied
#                    from an older doc without re-checking stays false.
#   licence_evidence URL / file path / tool result where the licence was seen
#   commercial_ok    true | false | unknown — could a paid Researchly use a
#                    model or text derived from it? (D2: free *for now*)
#   permitted_use    subset of:
#                      private_eval         owner's machine only, never committed output
#                      ci_eval              may run in CI (data fetched at run time or
#                                           already in this private repo; never published)
#                      knowledge_derivation authored rules/questions/Learn cards that
#                                           paraphrase and cite (D7); no passages
#                      train_experimental   train models that are NOT shipped
#                      ship_model           weights trained on it may ship
#                      ship_text            its text may appear in a shipped artefact
#   current_use      what it is used for today, or "planned"
#   shipped_today    true if verbatim text, or a data derivative (word list,
#                    exemplar rows, model weights), from this source is inside
#                    packages/ or apps/ right now. Authored rules that merely
#                    cite a source do not count.
#   sha256           for a local single file (sha256sum)
#   manifest         for a local directory: file count, total bytes, and
#                    per-file sha256 where the set is small
#   items            optional per-member breakdown when members of one corpus
#                    carry different licences (e.g. per-article)
#   notes            caveats
#
# Owner decisions applied (ARCHITECTURE.md §13, 2026-10-03):
#   D2  free / non-commercial *for now* → NC-licensed data: private_eval and
#       ci_eval only, never ship_model (shipped models stay licence-clean)
#   D6  the 8 sample theses → private_eval and ci_eval (noise floor) only;
#       thesis-derived exemplars removed from shipped data
#   D7  Notes_On_Writing/ → knowledge_derivation only (paraphrase + cite;
#       never ship_text)
#   D8  Laya only via the S5 bake-off, never zero-shot
# Conservative default: licence unknown → permitted_use [private_eval] only,
# licence_verified false.
#
# Last full audit: 2026-10-03 (S0). Network note for that audit: huggingface.co,
# arxiv.org, aclanthology.org, ncbi.nlm.nih.gov, europepmc, cl.cam.ac.uk,
# textmining.lt and data.mendeley.com were blocked by the sandbox proxy, so
# every licence that lives only on those sites is recorded as unverified.
# github.com / raw.githubusercontent.com and the PubMed connector worked.

