# Researchly for Windows (apps/desktop-overlay-win): core tests and an
# unsigned build, on a Windows runner. Manual only (Actions tab, "Run
# workflow"); never on push or pull request. The core tests also run on
# Linux and macOS; this job proves the WPF app builds with Windows' own SDK.
name: Desktop overlay (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop-overlay-win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Core tests
        run: dotnet test tests/Researchly.Overlay.Core.Tests/Researchly.Overlay.Core.Tests.csproj -c Release --nologo --logger "console;verbosity=normal"
      - name: Build the app (unsigned)
        run: dotnet publish src/Researchly.Overlay/Researchly.Overlay.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64 --nologo
      - name: Check the rules travelled with the app
        shell: pwsh
        run: |
          if (-not (Test-Path publish/win-x64/rules/fields.json)) { throw "rules/fields.json missing from the build" }
          if (-not (Test-Path publish/win-x64/rules/apps-windows.json)) { throw "rules/apps-windows.json missing from the build" }
      - uses: actions/upload-artifact@v4
        with:
          name: researchly-overlay-win-x64-unsigned
          path: apps/desktop-overlay-win/publish/win-x64
          retention-days: 7
