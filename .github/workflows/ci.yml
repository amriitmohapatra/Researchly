# Runs on every pull request and every push to main.
# Definition of done for a slice (ARCHITECTURE.md ADR-08): all jobs green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"          # the user's interpreter; catches 3.11+ syntax
          cache: pip
          cache-dependency-path: packages/core/requirements.txt
      - uses: actions/setup-java@v4       # grammar tier (LanguageTool) needs a real JRE
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache LanguageTool download
        uses: actions/cache@v4
        with:
          path: ~/.cache/language_tool_python
          key: languagetool-${{ hashFiles('packages/core/requirements.txt') }}
      - name: Install engine dependencies
        run: |
          python -m pip install -r packages/core/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run tests
        working-directory: packages/core
        run: python -m pytest tests/ -q

  engine-service:
    # The hosted engine (services/engine): contract, errors, the Q6 privacy
    # canary, config isolation, rate limit, CORS, health. Java gives the
    # grammar tier a real LanguageTool, as on Cloud Run's sidecar.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            packages/core/requirements.txt
            services/engine/requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache LanguageTool download
        uses: actions/cache@v4
        with:
          path: ~/.cache/language_tool_python
          key: languagetool-${{ hashFiles('packages/core/requirements.txt') }}
      - name: Install
        run: python -m pip install -c packages/core/requirements.txt -r services/engine/requirements-dev.txt
      - name: Contract is up to date with the service's schemas
        working-directory: services/engine
        run: python -m researchly_service.export_openapi --check
      - name: Service tests
        working-directory: services/engine
        run: python -m pytest tests/ -q

  contract:
    # The TypeScript types surfaces import must match the OpenAPI document.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/contract/package-lock.json
      - working-directory: packages/contract
        run: npm ci && npm run check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint and the confidentiality boundary check
        run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build, engine mocked)
        run: npm run test:e2e

  engine-image:
    # Build the image exactly as Cloud Run will run it, prove no private
    # material got in, and prove it boots and answers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f services/engine/Dockerfile -t researchly-engine:ci .
      - name: No theses, course PDFs or corpus files in the image
        run: |
          docker create --name probe researchly-engine:ci >/dev/null
          docker export probe | tar -t > image-files.txt
          if grep -E -i '(Sample_thesis_drafts|Notes_On_Writing|/dogfood/|/legacy/|/ml/|\.(pdf|docx|joblib)$)' image-files.txt \
               | grep -v -E 'site-packages/'; then
            echo "::error::private material found in the image"; exit 1
          fi
          echo "$(wc -l < image-files.txt) paths checked; none private"
      - name: Boots and answers /v1/health
        run: |
          docker run -d --name eng -p 8080:8080 -e RESEARCHLY_GRAMMAR=0 researchly-engine:ci
          for i in $(seq 1 60); do curl -fsS localhost:8080/v1/health && exit 0; sleep 2; done
          docker logs eng; exit 1

  third-party-text:
    # PLAN.md S0 exit check: no thesis, course or book passages in shippable code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Test the scanner itself
        run: python -m pip install -q pytest && python -m pytest ml/tools -q
      - name: Scan packages/, apps/, services/
        run: python ml/tools/check_third_party.py

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits to pick its scan range
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"   # report in the job log; the token is read-only
